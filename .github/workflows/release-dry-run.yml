name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - scripts/release-check.js
      - scripts/package-smoke.js
      - .github/workflows/release*.yml

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic release gate
        run: npm run release:check

      - name: Generate release notes preview
        run: |
          {
            echo "## failureseed release candidate"
            echo
            echo "### Recent commits"
            git log --oneline --max-count=20
            echo
            echo "### Verification checklist"
            echo "- npm run release:check"
            echo "- npm pack --dry-run"
            echo "- npm run package:smoke"
          } > release-notes-preview.md
          cat release-notes-preview.md

      - name: Upload release notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-preview
          path: release-notes-preview.md
